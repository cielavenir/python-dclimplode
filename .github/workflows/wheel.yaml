name: Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: [cp39, cp310, cp311, cp312, cp313, cp314]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_TEST_REQUIRES: pytest psutil pytest-xdist
          CIBW_TEST_COMMAND: >-
            pytest -q {project}/test --deselect test/test_dclimplode.py::test_dclimplode
            && pytest -n 4 -q {project}/test/test_dclimplode.py::test_dclimplode
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python }}-${{ runner.arch }}
          path: wheelhouse/*.whl

  legacy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2022]
        python: [cp27, cp35, cp36, cp37, cp38]
        exclude:
          # cibuildwheel cannot target CPython 3.5 on macOS 11 or newer.
          - os: macos-15-intel
            python: cp35
          # Windows CPython 2.7 requires a custom legacy compiler toolchain.
          - os: windows-2022
            python: cp27

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v1.12.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_TEST_COMMAND: python {project}/test/legacy_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python }}-${{ runner.arch }}
          path: wheelhouse/*.whl

  pypy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: pp310
          - os: ubuntu-latest
            python: pp311
          - os: macos-latest
            python: pp311
          - os: macos-15-intel
            python: pp311
          - os: windows-latest
            python: pp310
          - os: windows-latest
            python: pp311

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_ENABLE: pypy pypy-eol
          CIBW_TEST_REQUIRES: pytest psutil pytest-xdist
          CIBW_TEST_COMMAND: >-
            pytest -q {project}/test --deselect test/test_dclimplode.py::test_dclimplode
            && pytest -n 4 -q {project}/test/test_dclimplode.py::test_dclimplode
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python }}-${{ runner.arch }}
          path: wheelhouse/*.whl

  legacy-pypy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: pp27
          - os: ubuntu-latest
            python: pp36
          - os: ubuntu-latest
            python: pp37
          - os: windows-2022
            python: pp36

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v1.12.0
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_TEST_COMMAND: python {project}/test/legacy_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}-${{ matrix.python }}-${{ runner.arch }}
          path: wheelhouse/*.whl

  pyston:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Install system build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl git patchelf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Pyston
        run: |
          curl -L -o /tmp/pyston.deb https://github.com/pyston/pyston/releases/download/pyston_2.3.5/pyston_2.3.5_20.04_amd64.deb
          DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/pyston.deb
          ln -sf /usr/bin/pyston /usr/local/bin/python
          python --version
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel
          python -m build --wheel
      - name: Repair wheel
        run: |
          python -m pip install 'auditwheel~=5.1.0'
          python -m auditwheel repair --plat linux_x86_64 --wheel-dir wheelhouse dist/*.whl
      - name: Test installed wheel
        run: |
          python -m pip install --no-index --find-links wheelhouse dclimplode
          python test/legacy_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-Pyston-2.3.5-x64
          path: wheelhouse/*.whl
