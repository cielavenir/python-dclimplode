name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: uv build
      - name: Install built wheel
        run: |
          uv venv
          uv pip install pytest psutil pytest-xdist
          uv pip install --no-index --find-links dist dclimplode
      - name: Test installed extension
        run: uv run --no-project --no-sync pytest -v test --deselect test/test_dclimplode.py::test_dclimplode
      - name: Test corpus modes in parallel
        run: uv run --no-project --no-sync pytest -n 4 -v test/test_dclimplode.py::test_dclimplode
