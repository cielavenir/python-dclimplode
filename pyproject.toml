[build-system]
requires = [
    "setuptools",
    # CPython 3.12+ builds an abi3 extension, which needs pybind11 with limited API support.
    "pybind11 @ git+https://github.com/cielavenir/pybind11.git@3.1.0-stableapi312 ; platform_python_implementation == 'CPython' and python_version >= '3.12'",
    "pybind11; platform_python_implementation != 'CPython' or python_version < '3.12'",
]
build-backend = "setuptools.build_meta"
